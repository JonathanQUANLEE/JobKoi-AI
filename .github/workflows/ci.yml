name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支并行 push 时取消旧 run，省 CI 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # commit message 或 PR title 带 [skip ci] 的跳过整个 job。
    # 注：``github.event.head_commit.message`` 只在 push 事件里存在；
    # pull_request 事件下 head_commit 是 null，contains(null, ...) 返回 false，
    # 自动 fall through 到检查 PR title。
    if: |
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: 安装 Python 3.13
        run: uv python install 3.13

      - name: 安装依赖（frozen lockfile）
        run: uv sync --frozen

      - name: Smoke import check
        # 没有真测试也能拦下"改名 / 移文件 / import 烂掉"那一类回归。
        # 每多一个核心模块就往这里加一行。
        # 2026-10-08 清理：0.2 收敛后 LLM/RAG/vectorization 全家（providers /
        # models.* / vectorization / gui.env_io / gui.llm_config / gui.resume_io /
        # gui.history / gui.updates / gui.diagnostics / diagnose / audit.telemetry）
        # 已从磁盘删除，但这些 import 行一直留着——CI smoke 实际是坏的。
        # 本行集 = 磁盘上真实存在的核心模块。
        run: |
          # Phase D-pre 后：业务代码全部进 boss_zhipin/，根目录 main.py 仅
          # 是向后兼容 shim。CI 同时校验两侧：(1) 包导入，(2) main.py shim 能 import。
          uv run python -c "import main"
          uv run python -c "import boss_zhipin"
          uv run python -c "from boss_zhipin.cli import _cli_main, run_automation, RECOMMEND_URL"
          uv run python -c "from boss_zhipin.paths import is_standalone, app_data_dir, ensure_app_data_cwd, APP_IDENTIFIER"
          uv run python -c "from boss_zhipin.audit import validate_letter, log_attempt"
          uv run python -c "from boss_zhipin.utils.retry import retry_with_backoff"
          uv run python -c "from boss_zhipin.config.profiles import load_profile"
          uv run python -c "from boss_zhipin.config.filter_rules import match_posting, explain_posting_match"
          uv run python -c "from boss_zhipin.website_oper.finding_jobs import open_browser_with_options, log_in, get_tab, send_chat_message, shutdown, _strip_jd_noise, _clear_singleton_locks, _reap_profile_chrome"
          uv run python -c "from boss_zhipin.website_oper.write_response import send_job_descriptions_to_chat, send_response_and_go_back"
          uv run python -c "from boss_zhipin.website_oper.job_api import fetch_search_page, parse_api_job, to_job_posting"
          uv run python -c "from scripts.dump_boss_page import PROBE_JS, TARGET_URL, main"
          uv run python -c "from boss_zhipin.gui.events import ProgressEvent, EventKind, emit, set_emit_callback"
          uv run python -c "from boss_zhipin.gui.runner import start_run, stop_run, is_running, get_task, reset"
          uv run python -c "from boss_zhipin.gui.log_bridge import CallbackHandler, install, uninstall"
          uv run python -c "from boss_zhipin.gui.i18n import msg"
          uv run python -c "from boss_zhipin.gui.profile_io import list_profiles, get_profile, save_profile"
          uv run python -c "from boss_zhipin.gui.run_state import record, get_state, reset"
          uv run python -c "from boss_zhipin.gui.review_control import request_review, decide, get_state, reset"
          # agent 里程碑 1（对话式智能助手后端）
          uv run python -c "from boss_zhipin.agent.presets import LLM_PRESETS"
          uv run python -c "from boss_zhipin.agent.llm_client import chat_completion_with_retry, chat_completion, LLMClientError, LLMRetryableError"
          uv run python -c "from boss_zhipin.agent.config_io import read_config, write_config, mask_key, merge_saved_key, AgentConfig"
          uv run python -c "from boss_zhipin.agent.profile_generator import generate, sanitize_profile, parse_llm_json"
          # 里程碑 2+3（统计/简历/预览/AI 招呼语/回复检测）
          uv run python -c "from boss_zhipin.gui.stats_io import query_stats, format_stats"
          uv run python -c "from boss_zhipin.gui.resume_io import list_resumes, set_default_resume, get_default_resume"
          uv run python -c "from boss_zhipin.gui.preview import preview_jobs"
          uv run python -c "from boss_zhipin.agent.greeting_generator import generate_greeting"
          uv run python -c "from boss_zhipin.website_oper.message_check import check_new_replies, reset"

      - name: 跑 pytest
        run: uv run pytest tests/ -v --tb=short
        env:
          # 单测不需要真凭据，给假值避免下游意外去读真的 .env
          LLM_API_KEY: test-fake-key
          LLM_MODEL: test-fake-model
          BOSS_RETRY_BASE_DELAY: "0.01"  # 加速 retry 测试
          BOSS_RETRY_MAX_DELAY: "0.05"

  no-leak:
    # 防止 .env / assistant.json / chrome_profile/* 这类敏感产物意外提交
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查仓库里没意外提交敏感文件
        run: |
          for f in .env assistant.json; do
            if git ls-files | grep -qE "^${f}\$"; then
              echo "❌ 仓库里追踪了不该提交的文件：${f}"
              exit 1
            fi
          done
          if git ls-files | grep -qE "^chrome_profile/|^vectorstores/|^logs/"; then
            echo "❌ 仓库里追踪了 chrome_profile/ vectorstores/ logs/ 之一，应该都在 .gitignore"
            exit 1
          fi
          echo "✅ 敏感产物未被追踪"
