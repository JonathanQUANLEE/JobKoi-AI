extends: backend-intern.yml

search:
  query: 广州后端开发实习

page_filters:
  city:
    enabled: true
    values:
      - 广州

filters:
  location:
    any:
      # 页面城市筛选点不上时，本地地点规则继续兜底。
      enabled: true
      scope: location
      match: contains
      case_sensitive: false
      keywords:
        - 广州
