search:
  query: ''
page_filters:
  strict: false
  city:
    enabled: true
    values:
    - 北京
    - 上海
    - 广州
    - 深圳
    - 杭州
    - 成都
    - 南京
    - 武汉
  education:
    enabled: true
    values:
    - 大专
    - 本科
  boss_active:
    enabled: true
    values:
    - 本周活跃
    - 今日活跃
    - 刚刚活跃
    - 3日内活跃
filters:
  title:
    required:
      enabled: false
      scope: title_description
      match: contains
      case_sensitive: false
      keywords: []
    any:
      enabled: true
      scope: title_description
      match: contains
      case_sensitive: false
      keywords:
      - ai
      - AI
      - 大模型
      - LLM
      - RAG
      - 后端开发
      - 全栈
      - 测试
      - golang
      - agent
      - 软件
    exclude:
      enabled: true
      scope: title_description
      match: contains
      case_sensitive: false
      keywords:
      - 字节跳动
send:
  mode: auto
  greeting_file: ./greetings/default.txt
  delay_min: 30
  delay_max: 60
  max_sent: 50
  daily_sent_limit: 100
  stop_on_captcha: true
state:
  seen_jobs_file: ./logs/seen_jobs.jsonl
  sent_log_file: ./logs/sent_jobs.jsonl
  skipped_log_file: ./logs/skipped_jobs.jsonl
