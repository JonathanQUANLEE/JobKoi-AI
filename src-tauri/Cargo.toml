# Phase D standalone bundle 用的 Rust 项目（独立于 pytauri 官方 workspace，
# 所有 `workspace = true` 都改成显式版本）。
#
# 只在打 standalone .app 时编译；wheel dev 模式（uv run python -m
# boss_zhipin.tauri）完全不碰本目录。

[package]
name = "boss-zhipin"
version = "0.8.2"
description = "BOSS Zhipin Helper (PyTauri standalone)"
authors = ["JonathanQUANLEE"]
edition = "2021"

[lib]
# pytauri 要求 lib 和 bin 同名工程时 lib 名字加 `_lib` 后缀避开 Windows 链接冲突
name = "boss_zhipin_lib"
# cdylib 给 PyO3 pymodule，staticlib 给 bin，rlib 给 cargo dep 解析
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "boss-zhipin"
path = "src/main.rs"
# 2026-10-14 修复：删掉 required-features = ["pytauri/standalone"]——
# tauri-cli 已知 bug：[[bin]] 带 required-features 时，cli 跑 cargo metadata
# 不激活 feature，targets 里没有这个 bin，interface/rust.rs unwrap None 直接
# panic。本目录只被 tauri build 使用，而 tauri.conf.json 的
# build.features 已永久启用 pytauri/standalone，删除无副作用。
# （代价：有人裸跑 `cargo build`（不带 feature）会得到 main.rs 编译错误，
#  而不是静默跳过 bin——dev 模式不碰本目录，无实际影响。）

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri 精确锁 2.11.2（2026-10-19 自动更新接入时发现）：tauri-plugin-updater
# 2.14 会把 tauri 拉到 2.12.4，而 pytauri-core 0.8.0 对 Effect 枚举的穷举
# match 在 2.12 下编译失败（E0004）。锁 2.11.2 后 cargo 自动选兼容该版本
# 的 updater/process 插件版本。升级 pytauri（>0.8）时才能放开此锁。
tauri = { version = "=2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = "0.25"
# plugin-updater/plugin-process（2026-10-19 软件内自动更新）：features 让
# pytauri_plugins 的 Python 绑定可用；下面的直接依赖是 ACL 硬要求——
# tauri-build 经 cargo links 机制（DEP_*_PERMISSION_FILES_PATH）收集插件
# 权限，links 元数据只传给直接依赖，仅靠 features 传递会导致 capabilities
# 里的 updater:* / process:* 编译期报未知权限。
pytauri = { version = "0.8", features = ["plugin-updater", "plugin-process"] }
tauri-plugin-pytauri = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# standalone bundle 用独立 profile，不污染 `tauri dev` 的 target/release
# （pytauri 官方 build-standalone 教程的做法）
[profile.bundle-release]
inherits = "release"
